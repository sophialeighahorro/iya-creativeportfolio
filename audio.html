<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Works - Iya's Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="page-header">
        <a href="index.html" class="back-btn">← Back</a>
        <h1>Audio Works</h1>
    </div>

    <section class="gallery-container">
        <div class="audio-grid">
            
            <div class="audio-card">
                <h3>Remix</h3>
                <p>Sound design and mixing for a student podcast project.</p>
                <audio controls>
                    <source src="audio/remix.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="audio-card">
                <h3>Medley</h3>
                <p>Custom sound effects recorded for an animation.</p>
                <audio controls>
                    <source src="audio/medley.mp3" type="audio/mpeg">
                
                </audio>
            </div>

            <div class="audio-card">
                <h3>Dubbing</h3>
                <p>Original background music synced to visual motion.</p>
                <video controls playsinline>
                    <source src="videos/dubbing.mov" type="video/mp4">
                </video>
            </div>

        </div>
    </section>

</body>
</html>
