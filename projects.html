    <div id="myModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">

        <video class="modal-content" id="vid01" controls></video>

        <div id="caption"></div>
        <div id="description"></div>
    </div>

    <script>
    // 1. Get the modal background
    var modal = document.getElementById("myModal");
    
    // 2. Get the image, video, and text elements inside the modal
    var modalImg = document.getElementById("img01");
    var modalVid = document.getElementById("vid01"); 
    var captionText = document.getElementById("caption");
    var descText = document.getElementById("description");

    // 3. Function to OPEN the modal (Notice the new 'type' parameter)
    function openModal(element, type) {
        modal.style.display = "block";
        
        // Copy the Title and Description for both images and videos
        captionText.innerHTML = element.getAttribute("alt") || ""; 
        descText.innerHTML = element.dataset.desc || ""; 

        // IF IT IS A VIDEO:
        if (type === 'video') {
            modalImg.style.display = "none";     // Hide the image tag
            modalVid.style.display = "block";    // Show the video tag
            modalVid.src = element.src;          // Copy the video source
            modalVid.play();                     // Auto-play it!
        } 
        // IF IT IS AN IMAGE:
        else {
            modalVid.style.display = "none";     // Hide the video tag
            modalImg.style.display = "block";    // Show the image tag
            modalImg.src = element.src;          // Copy the image source
        }
    }

    // 4. Function to CLOSE the modal
    function closeModal() {
        modal.style.display = "none";
        modalVid.pause(); // CRITICAL: Stops the video from playing in the background!
        modalVid.src = ""; // Clears the video source
    }

    // 5. Close if user clicks outside the image/video
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal(); // Uses the new close function so the video stops properly
        }
    }
</script>
